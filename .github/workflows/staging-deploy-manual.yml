name: Staging Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deploy-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Staging

    steps:
      - name: Deploy selected branch to staging
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd sample-projects/automatic-bassoon
            ./scripts/deploy-staging.sh ${{ inputs.branch }}
